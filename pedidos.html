<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pedidos - SneakerWorld</title>
  <link rel="stylesheet" href="pedidos.css">
  
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>🏆 SneakerWorld</h1>
    <p>Haz tu pedido de zapatillas fácilmente</p>
  </header>

  <section class="pedidos">
    <h2>🛍️ Realiza tu Pedido</h2>
    <form action="#" method="post" class="form-pedidos">
      <label for="nombre">👤 Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">📧 Correo electrónico:</label>
      <input type="email" id="email" name="email" required>

      <label for="telefono">📱 Teléfono:</label>
      <input type="tel" id="telefono" name="telefono" required>

      <label for="modelo">👟 Modelo de zapatillas:</label>
      <input type="text" id="modelo" name="modelo" placeholder="Ej: Nike Air Max" required>

      <label for="talla">📏 Talla:</label>
      <select id="talla" name="talla" required>
        <option value="">Selecciona tu talla</option>
        <option value="38">38</option>
        <option value="39">39</option>
        <option value="40">40</option>
        <option value="41">41</option>
        <option value="42">42</option>
        <option value="43">43</option>
      </select>

      <label for="cantidad">🔢 Cantidad:</label>
      <input type="number" id="cantidad" name="cantidad" min="1" value="1" required>

      <label for="direccion">📍 Dirección de envío:</label>
      <textarea id="direccion" name="direccion" rows="3" required></textarea>

      <button type="submit">Enviar Pedido</button>
    </form>
  </section>

</body>
</html>
